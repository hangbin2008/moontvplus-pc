name: Build Windows & Linux

on:
  # 推送 tag 时触发编译并发布 Release
  push:
    tags:
      - 'v*'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoonTVPlus-Windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          retention-days: 30

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # 从 CHANGELOG.md 提取当前 tag 对应章节(从 "## vX.Y.Z" 到下一个 "## v" 之间)
          awk -v ver="${{ github.ref_name }}" '
            /^## v/ { p = ($0 ~ "^## " ver " ") }
            p
          ' CHANGELOG.md > section.md
          {
            echo "### 下载安装"
            echo ""
            echo "- **Windows**: 下载 \`MoonTVPlus-*.exe\`，双击安装即可"
            echo "- **Linux**: 下载 \`MoonTVPlus-*.AppImage\`，添加执行权限后运行"
            echo ""
            cat section.md
          } > release-notes.md
          cat release-notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MoonTVPlus ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.AppImage
          draft: false
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Linux AppImage
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoonTVPlus-Linux
          path: |
            dist/*.AppImage
          retention-days: 30

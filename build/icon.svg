<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 主题红渐变(对应 primary light #ff2d3f / #e50914 / primary dark #b00710) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3a4a"/>
      <stop offset="50%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#a8060f"/>
    </linearGradient>

    <!-- 新月:外圆减右移内圆,开口朝右(整体偏左,给右侧播放三角留位) -->
    <mask id="crescentMask">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="430" cy="512" r="260" fill="white"/>
      <circle cx="300" cy="512" r="212" fill="black"/>
    </mask>

    <!-- 顶部高光 -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#topHighlight)"/>

  <!-- 新月(纯白,小尺寸高对比) -->
  <g mask="url(#crescentMask)">
    <rect width="1024" height="1024" fill="#ffffff"/>
  </g>

  <!-- 播放三角(位于新月右侧开口,大而粗,圆角,纯白,与新月保留≥54px红底间隙) -->
  <path
    d="M 566 384 L 566 640 Q 566 664 587 652 L 806 536 Q 834 520 806 504 L 587 372 Q 566 360 566 384 Z"
    fill="#ffffff"
  />

  <!-- 浅色任务栏上的边缘界定 -->
  <rect x="16" y="16" width="992" height="992" rx="212" ry="212"
        fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="20"/>
</svg>
